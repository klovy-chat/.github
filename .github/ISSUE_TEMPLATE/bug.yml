name: Bug report
description: File a bug report
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - backend
        - frontend
        - website
        - application
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we see the same behaviour?
    validations:
      required: false
